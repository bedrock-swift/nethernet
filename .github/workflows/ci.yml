name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test

  musl:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the Static Linux SDK
        run: >-
          swift sdk install
          https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
          --checksum 3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a
      - run: swift build --swift-sdk x86_64-swift-linux-musl

  libdatachannel:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends cmake g++ libssl-dev ninja-build
      - uses: actions/checkout@v4
        with:
          repository: paullouisageneau/libdatachannel
          ref: c6696d157b5612df2a741d9a03b192b47ab6cefb
          submodules: recursive
          persist-credentials: false
          path: .native/libdatachannel
      - name: Build libdatachannel
        run: |
          cmake -S .native/libdatachannel -B .native/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNO_MEDIA=ON -DNO_WEBSOCKET=ON \
            -DNO_EXAMPLES=ON -DNO_TESTS=ON
          cmake --build .native/build --parallel 2
      - name: Test native WebRTC peers
        env:
          NETHERNET_TEST_LIBRARY: ${{ github.workspace }}/.native/build/libdatachannel.so
        run: swift test --filter nativePeer
